services:
  - type: web
    name: legalcheck-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: legalcheck-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: legalcheck-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: PRIVATE_STORAGE_PATH
        value: /var/data/private-documents
      - key: LLM_PROVIDER
        value: disabled
      - key: LLM_API_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL_NAME
        value: not-configured
      - key: LLM_MODEL_VERSION
        value: v1
      - key: EMBEDDING_PROVIDER
        value: disabled
      - key: RATE_LIMIT_LOGIN_PER_MINUTE
        value: "10"
      - key: RATE_LIMIT_AUTH_PER_MINUTE
        value: "10"
      - key: RATE_LIMIT_UPLOAD_PER_MINUTE
        value: "10"
      - key: RATE_LIMIT_AUDIT_PER_MINUTE
        value: "5"
      - key: AUDIT_JOB_TIMEOUT_SECONDS
        value: "1800"
      - key: AUDIT_STALE_AFTER_SECONDS
        value: "2100"
    disk:
      name: private-documents
      mountPath: /var/data/private-documents
      sizeGB: 1

  - type: worker
    name: legalcheck-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.audit_worker
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: legalcheck-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: legalcheck-redis
          type: redis
          property: connectionString
      - key: PRIVATE_STORAGE_PATH
        value: /var/data/private-documents
      - key: LLM_PROVIDER
        value: disabled
      - key: LLM_API_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL_NAME
        value: not-configured
      - key: LLM_MODEL_VERSION
        value: v1
      - key: EMBEDDING_PROVIDER
        value: disabled
      - key: AUDIT_JOB_TIMEOUT_SECONDS
        value: "1800"
      - key: AUDIT_STALE_AFTER_SECONDS
        value: "2100"
    disk:
      name: private-documents
      mountPath: /var/data/private-documents
      sizeGB: 1

databases:
  - name: legalcheck-db
    databaseName: legalcheck
    plan: free

  - name: legalcheck-redis
    plan: free
